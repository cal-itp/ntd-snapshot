[project]
name = "ntd-snapshot"
version = "0.1.0"
description = "National Transit Database reports by Caltrans Division of Data & Digital Services"
readme = "README.md"
requires-python = ">=3.11.0, <3.12.0"
# click<8.3: click 8.3 added strict flag validation that's incompatible with
# typer's boolean-flag generation. See cal-itp/data-analyses#2044.
dependencies = [
    "altair>=6.0.0",
    "altair-transform>=0.2.0",
    "branca>=0.8.2",
    "click<8.3",
    "geopandas>=0.14.0,<0.15.0",
    "gcsfs>=2026.4.0",
    "folium>=0.20.0,<0.21.0",
    "great-tables>=0.22.0",
    "gt-extras>=0.0.8",
    "ipython==9.6.0",
    "itables>=2.7.3",
    "mapclassify>=2.8.0",
    "matplotlib>=3.10.5,<4.0.0",
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pandas-gbq==0.35",
    "openpyxl>=3.1.5",
    "polars>=1.40.1",
    "pyaml==21.10.1", # had "pyaml>=26.2.1"
    "shapely>=2.0.1,<3.0.0",
    "vegafusion==2.0.3",
    "vl-convert-python>=1.6.0",
    "calitp-portfolio",
    "snapshot-utils",
]

[tool.uv.workspace]
members = [
    "_snapshot_utils",
    "calitp-portfolio",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
	"pyproject-local-kernel",
	"ruff>=0.15.20",
]


[tool.uv.sources]
snapshot-utils = { workspace = true }
calitp-portfolio = { workspace = true }
